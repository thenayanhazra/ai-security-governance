# Identifiers the control catalogue is allowed to cite, and the version of each
# framework they come from. tools/validate.py rejects anything not listed here.
# MITRE ATLAS IDs are checked separately against MITRE's published data.

frameworks:
  nist_ai_rmf:
    name: NIST AI Risk Management Framework
    version: "AI RMF 1.0 (NIST AI 100-1). NIST has said 1.0 is under revision."
    url: https://airc.nist.gov/airmf-resources/airmf/5-sec-core/
  iso_42001:
    name: ISO/IEC 42001
    version: "ISO/IEC 42001:2023, Annex A"
    url: https://www.iso.org/standard/81230.html
  eu_ai_act:
    name: EU AI Act
    version: "Regulation (EU) 2024/1689 as amended by Regulation (EU) 2026/1744 (Digital Omnibus on AI)"
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  owasp_llm:
    name: OWASP Top 10 for LLM Applications
    version: "2026 edition (published August 2026)"
    url: https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/
  owasp_asi:
    name: OWASP Top 10 for Agentic Applications
    version: "2026 edition (published December 2025)"
    url: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
  mitre_atlas:
    name: MITRE ATLAS
    version: "v2026.10"
    url: https://atlas.mitre.org/

nist_ai_rmf:
  GOVERN 1.1: Legal and regulatory requirements involving AI are understood, managed and documented
  GOVERN 1.2: Trustworthy AI characteristics are integrated into policies and practices
  GOVERN 1.3: Risk management effort is matched to risk tolerance
  GOVERN 1.4: Risk management process and outcomes are set through transparent policies and controls
  GOVERN 1.5: Ongoing monitoring and periodic review are planned, with roles and frequency defined
  GOVERN 1.6: Mechanisms are in place to inventory AI systems, resourced by risk priority
  GOVERN 1.7: Decommissioning and phase-out processes do not increase risk
  GOVERN 2.1: Roles, responsibilities and lines of communication for AI risk are documented and clear
  GOVERN 2.2: Personnel and partners receive AI risk training
  GOVERN 2.3: Executive leadership takes responsibility for decisions about AI risk
  GOVERN 4.1: Policies foster critical thinking and a safety-first mindset
  GOVERN 4.2: Teams document and communicate AI risks and impacts
  GOVERN 4.3: Practices enable AI testing, incident identification and information sharing
  GOVERN 6.1: Policies address AI risks from third-party entities, including IP infringement
  GOVERN 6.2: Contingency processes handle failures or incidents in high-risk third-party data or AI systems
  MAP 1.1: Intended purposes, context, norms, settings and expectations are documented
  MAP 1.5: Organisational risk tolerances are determined and documented
  MAP 2.1: Specific tasks and methods the AI system supports are defined
  MAP 2.2: Knowledge limits and human oversight of outputs are documented
  MAP 3.3: Targeted application scope is specified and documented
  MAP 3.5: Human oversight processes are defined, assessed and documented
  MAP 4.1: Approaches for mapping technology and legal risks of components are documented
  MAP 4.2: Internal risk controls for components, including third-party AI, are identified and documented
  MAP 5.1: Likelihood and magnitude of each identified impact are documented
  MEASURE 1.1: Metrics are selected for the most significant risks; unmeasured risks are documented
  MEASURE 1.2: Metrics and control effectiveness are regularly reassessed
  MEASURE 1.3: Independent assessors are involved in regular assessments
  MEASURE 2.4: Functionality and behaviour are monitored in production
  MEASURE 2.6: Safety risks are evaluated regularly and the system fails safely
  MEASURE 2.7: Security and resilience are evaluated and documented
  MEASURE 2.8: Transparency and accountability risks are examined and documented
  MEASURE 2.10: Privacy risk is examined and documented
  MEASURE 3.1: Existing, unanticipated and emerging risks are tracked over time
  MANAGE 1.1: A determination is made whether the AI system achieves its purpose and should proceed
  MANAGE 1.3: Responses to high-priority risks are developed, planned and documented
  MANAGE 2.3: Procedures respond to and recover from previously unknown risks
  MANAGE 2.4: Mechanisms exist to supersede, disengage or deactivate AI systems
  MANAGE 3.1: Third-party AI risks are monitored and controls applied
  MANAGE 3.2: Pre-trained models are monitored as part of regular maintenance
  MANAGE 4.1: Post-deployment monitoring, incident response and change management are implemented
  MANAGE 4.3: Incidents and errors are communicated and tracked through recovery

iso_42001:
  A.2.2: AI policy
  A.2.3: Alignment with other organisational policies
  A.2.4: Review of the AI policy
  A.3.2: AI roles and responsibilities
  A.3.3: Reporting of concerns
  A.4.2: Resource documentation
  A.4.6: Human resources
  A.5.2: AI system impact assessment process
  A.5.3: Documentation of AI system impact assessments
  A.5.4: Assessing AI system impact on individuals or groups of individuals
  A.6.2.4: AI system verification and validation
  A.6.2.5: AI system deployment
  A.6.2.6: AI system operation and monitoring
  A.6.2.7: AI system technical documentation
  A.6.2.8: AI system recording of event logs
  A.7.2: Data for development and enhancement of AI system
  A.7.5: Data provenance
  A.8.2: System documentation and information for users
  A.8.4: Communication of incidents
  A.9.2: Processes for responsible use of AI systems
  A.9.4: Intended use of the AI system
  A.10.2: Allocating responsibilities
  A.10.3: Suppliers

eu_ai_act:
  Art. 4: AI literacy
  Art. 5: Prohibited AI practices
  Art. 6: Classification rules for high-risk AI systems
  Art. 9: Risk management system (high-risk)
  Art. 12: Record-keeping (high-risk)
  Art. 14: Human oversight (high-risk)
  Art. 15: Accuracy, robustness and cybersecurity (high-risk)
  Art. 25: Responsibilities along the AI value chain
  Art. 26: Obligations of deployers of high-risk AI systems
  Art. 50: Transparency obligations for certain AI systems
  Art. 72: Post-market monitoring (providers of high-risk systems)
  Art. 73: Reporting of serious incidents (high-risk)

owasp_llm:
  LLM01: Prompt Injection
  LLM02: Sensitive Information Disclosure
  LLM03: Excessive Agency
  LLM04: Supply Chain
  LLM05: Data and Model Poisoning
  LLM06: Unbounded Consumption
  LLM07: Misinformation
  LLM08: Hidden Context Exposure
  LLM09: Vector and Embedding Weaknesses
  LLM10: Improper Output Handling

